repos:
  - repo: local
    hooks:
      - id: fleetmix-quality
        name: FleetMix Quality Gates
        entry: uv run python scripts/quality_gates.py
        language: system
        pass_filenames: false
        stages: [commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff-format
      - id: ruff

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        exclude: ^.github/
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1000']