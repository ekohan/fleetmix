# alpha_tests_template.yaml - Base for MCV/SCV break-even experiments

# PROBLEM params
vehicles:
  A:  # Base vehicle type for both MCV and SCV scenarios
    capacity: 2700
    fixed_cost: 100
    avg_speed: 30  # km/h
    service_time: 25  # minutes per customer
    max_route_time: 10  # hours

variable_cost_per_hour: 10.0

depot:
  latitude: 4.7
  longitude: -74.1

goods:
  - Dry
  - Chilled
  - Frozen

light_load_penalty: 0
light_load_threshold: 0
compartment_setup_cost: 0  # Overridden programmatically for MCV runs

allow_split_stops: true

# ALGORITHM params
clustering:
  max_depth: 20
  method: kmedoids
  distance: euclidean
  geo_weight: 0.7
  demand_weight: 0.3
  route_time_estimation: BHH

prune_tsp: false

post_optimization: true
small_cluster_size: 1000
nearest_merge_candidates: 1000
max_improvement_iterations: 20

pre_small_cluster_size: 5
pre_nearest_merge_candidates: 50

# IO params
demand_file: ""  # Overridden in experiment script

format: json

# RUNTIME params
verbose: true
debug: false
solver: gurobi
gap_rel: 0.005
time_limit: 60 