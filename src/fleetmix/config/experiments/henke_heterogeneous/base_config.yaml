# ---------------------------------------------------------------------------
# Henke 2015 n=10 heterogeneous-fleet experiment (reviewer revision)
#
# Vehicle A replicates Henke's capacity; Vehicle B is half.
# Fixed costs follow the Bogotá case study curve (paper §5.2):
#   cost(1000) ≈ 100, cost(500) ≈ 60 (linear A→B extrapolation, also
#   consistent with a power-law fit across Bogotá A/B/C vehicles).
# All other fleet/cost parameters taken directly from the case study.
# ---------------------------------------------------------------------------

# PROBLEM params
vehicles:
  A:  # replicates Henke capacity (2015 n=10 → 1000)
    capacity: 1000
    fixed_cost: 100
    avg_speed: 30          # km/h
    service_time: 25       # minutes per customer
    max_route_time: 10     # hours
  B:  # half of A
    capacity: 500
    fixed_cost: 60
    avg_speed: 30
    service_time: 25
    max_route_time: 10

variable_cost_per_hour: 10.00

depot:
  latitude: 4.7
  longitude: -74.1

goods:
  - Dry
  - Chilled
  - Frozen

light_load_penalty: 0
light_load_threshold: 0
compartment_setup_cost: 10

allow_split_stops: false  # match existing optimality-gap runs

# ALGORITHM params
clustering:
  max_depth: 20
  method: combine
  distance: euclidean
  geo_weight: 0.7
  demand_weight: 0.3
  route_time_estimation: 'BHH'

prune_tsp: true

post_optimization: true
small_cluster_size: 1000
nearest_merge_candidates: 1000
max_improvement_iterations: 20

pre_small_cluster_size: 5
pre_nearest_merge_candidates: 50

# IO params
format: 'json'

# RUNTIME params
verbose: false
debug: false
solver: auto
gap_rel: 0.005
time_limit: 60
